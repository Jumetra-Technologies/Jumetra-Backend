services:
  - type: web
    name: jumetra-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HHIP_DATA_DIR
        value: /var/data
      - key: HHIP_CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: HHIP_REQUIRE_AUTH
        value: "true"
    disk:
      name: jumetra-data
      mountPath: /var/data
      sizeGB: 1